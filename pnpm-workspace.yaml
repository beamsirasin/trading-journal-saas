# Build scripts must be explicitly approved (pnpm blocks them by default).
# Only add a package here after confirming why it needs a postinstall step.
#
#   sharp         - native image processing used by Next.js image optimization
#   unrs-resolver - native module resolver used by the ESLint import resolver
#   esbuild       - links its platform-native binary; pulled in by drizzle-kit
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
