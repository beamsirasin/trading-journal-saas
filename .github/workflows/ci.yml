name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # A nightly run so a test that breaks with the calendar rather than with a
  # commit is found on the day it breaks. Two of them already got through:
  # five integration tests went red on 2026-09-01 because a fixture seeded a
  # paid period ending that day, and nobody saw it for a day because nothing
  # pushed. Before that, the entire Dashboard rebuild landed inside a nine-day
  # window with no CI run at all, stranding an assertion nobody noticed.
  #
  # 22:00 UTC is 05:00 in Asia/Bangkok, so the result is waiting rather than
  # arriving mid-morning.
  #
  # IMPORTANT, and the reason this may look inert: GitHub runs scheduled
  # workflows from the DEFAULT BRANCH only, and this repository's default
  # branch is still `phase/00-foundation`, whose tip is the project's first
  # commit. Until the default branch is moved to `main` (see docs/roadmap.md,
  # "Release blockers and repository configuration") and this file reaches
  # `main`, this schedule will never fire. It is committed now so that fixing
  # the default branch is all that is needed, not so that it works today.
  # There is no way to schedule a run for "every active branch": a schedule
  # has exactly one ref, the default one.
  schedule:
    - cron: '0 22 * * *'

# A newer push to the same branch makes the in-flight run obsolete. Scheduled
# runs share the default branch's ref, so they are grouped by event too — a
# nightly run must never cancel, or be cancelled by, a push to that branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time canaries: scan-client-assets checks these exact values, not
      # merely secret-looking strings or environment-variable names.
      BETTER_AUTH_SECRET: client-bundle-auth-secret-canary-7f28f151
      GOOGLE_CLIENT_SECRET: client-bundle-google-secret-canary-b94fc913
      SMTP_PASSWORD: client-bundle-smtp-password-canary-2c6e9a41

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # No DATABASE_URL is set for this job. The build must therefore succeed
      # with no database reachable, which is the property that keeps a preview
      # deployment from failing on a connection at build time.
      - name: Production build
        run: pnpm build

      - name: Scan client assets for server secrets
        run: pnpm scan:client

      # A second canary: even when DATABASE_URL IS set, but points nowhere
      # reachable, the build must still succeed — proving Next.js's static
      # generation never opens a connection on its own (src/server/db/client.ts's
      # "no connection at import time" guarantee), not merely that an absent
      # variable happens to avoid the attempt.
      - name: Production build (invalid database host canary)
        env:
          DATABASE_URL: postgresql://user:pass@invalid-host-does-not-exist.invalid:5432/db
        run: pnpm build

  integration:
    name: Database migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading_os
          POSTGRES_PASSWORD: trading_os_ci
          POSTGRES_DB: trading_os_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_os -d trading_os_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # TEST_DATABASE_URL is the only database input to this job. Setup binds
      # the real DAL to it after normalizing aliases, requiring a test-like
      # database name, and checking the explicit disposable-data acknowledgement.
      TEST_DATABASE_URL: postgresql://trading_os:trading_os_ci@localhost:5432/trading_os_integration_test
      TEST_DATABASE_ACK: I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves the committed migrations create a complete schema from
      # nothing — never `drizzle-kit push` (CLAUDE.md §5), always the
      # tracked SQL files under drizzle/.
      - name: Apply migrations to a fresh database
        run: pnpm db:test:prepare

      # Migration 0009 seeds the single platform_vat_configuration baseline
      # row with `effective_at = now()` AT MIGRATION-APPLY TIME (correct,
      # unchanged production behavior — see that migration). Several
      # integration tests (e.g. checkout.integration.test.ts) exercise the
      # DB-authoritative VAT resolver (Phase 11F) against a FIXED simulated
      # clock in the past. On a freshly migrated CI database, the baseline's
      # real "now" can land AFTER that fixed test clock, so the resolver
      # correctly finds no yet-effective configuration and fails closed —
      # exactly as designed, just exercised at the wrong instant. This
      # guarded, TEST-only reset re-seeds the same baseline with a fixed,
      # clearly-historical `effective_at` (2000-01-01) that predates every
      # fixed test clock in this codebase, matching the exact initialization
      # local development and prior manual verification already relied on
      # (`pnpm db:test:reset`). It is gated by the identical
      # `validateTestDatabaseEnvironment` safety check as every other
      # destructive test script (TEST_DATABASE_URL must name a `test`/`e2e`
      # database distinct from DATABASE_URL, plus TEST_DATABASE_ACK above) —
      # this changes TEST initialization only, never production migration
      # 0009 or the production VAT resolver.
      - name: Reset guarded TEST database to its deterministic baseline
        run: pnpm db:test:reset

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    # TEMPORARY, AND A MEASUREMENT RATHER THAN A FIX. At 20 minutes this job
    # was cancelled mid-suite with no summary, so the serial cost of the
    # current 673 tests has never been observed — the last run that finished
    # was 523 tests in 11.5 minutes on 2026-08-23. 60 is a deliberately
    # generous ceiling chosen to get one complete run, not a claim that the
    # suite should take an hour. `workers: 1` is untouched on purpose: the
    # point is to measure the serial total before deciding between more
    # workers, sharding, or accepting the time. Put this back once the number
    # is known and the decision is made. See docs/roadmap.md.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading_os
          POSTGRES_PASSWORD: trading_os_ci
          POSTGRES_DB: trading_os_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_os -d trading_os_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://trading_os:trading_os_ci@localhost:5432/trading_os_e2e_test
      TEST_DATABASE_ACK: I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
      # Fixed, obviously-non-production value. Never used outside this
      # workflow; irrelevant to resolveAuthSecret()'s production fail-closed
      # check, since `next build`/`next start` here never run with a
      # production-shaped secret expectation beyond "present and long enough".
      BETTER_AUTH_SECRET: ci-github-actions-only-secret-never-used-in-production-00
      BETTER_AUTH_URL: http://127.0.0.1:3100
      # Widens (never disables) the per-route auth rate limits — see
      # src/lib/auth/server.ts's buildRateLimitCustomRules(). Every real
      # sign-in this suite performs shares one IP (this runner), which the
      # rate limiter cannot distinguish from a single attacker; a real
      # deployment must never set this.
      E2E_TEST_MODE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Apply migrations
        run: pnpm db:test:prepare

      # Same guarded, deterministic TEST-only re-seed as the integration
      # job (see that job's fuller comment) — this job's fresh CI database
      # would otherwise carry the same real-"now" VAT baseline timestamp.
      # No fixed-past-clock E2E spec currently depends on this, but applying
      # the identical initialization here keeps both jobs' TEST database
      # state consistent and guards against a future spec that does.
      - name: Reset guarded TEST database to its deterministic baseline
        run: pnpm db:test:reset

      # No Google credentials, no email provider — every DB-dependent auth
      # spec exercises the real email/password flow only; Google-button and
      # email-delivery specs assert the truthful "not configured" states
      # (see e2e/pricing-and-auth.spec.ts, e2e/auth-authorization.spec.ts).
      - name: Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
